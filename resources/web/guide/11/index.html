<!-- Unlayered 0.1.6: one click names where the person lives, and that place
     decides the privacy rules (PrivacyConsent::places / policy_for). No separate country page.
     The list comes from the slicer, so page and saved record always agree. Nothing is preselected;
     the place's printer-profile region becomes the wizard's region. -->
<body onLoad="OnInit()">
<div id="Title">
	<div id="RegionTitle" data-i18n="where_do_you_live">Where do you live?</div>
</div>
<div id="Content">
	<div id="RegionHelp" class="TextS2" data-i18n="where_do_you_live_help">Choose where you live so we can apply the right privacy settings. It also sets the region for printer profiles. You can change it later in Preferences.</div>
	<div id="RegionList" role="radiogroup" aria-labelledby="RegionTitle"></div>
</div>
<div id="AcceptArea">
	<button type="button" class="ButtonStyleConfirm ButtonTypeChoice" id="AcceptBtn" onclick="GotoPolicyPage()" data-i18n="next" disabled>Next</button>
</div>
</body>
</html>
