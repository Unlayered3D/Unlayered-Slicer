name: Release

# Cuts an Unlayered Slicer release. Deliberately self-contained rather than wired into
# build_all.yml -> build_check_cache.yml -> build_slicer.yml: that chain is shared with pull-request
# CI, its artifacts are directory uploads rather than release-ready files, and editing it for the
# release path risks the CI everything else depends on. It does reuse the same dependency cache, so
# there is no duplicate multi-hour deps build.
#
# Tag convention (enforced below): v0.0.4 for a release, v0.0.4-beta1 / -rc1 / -alpha1 for a
# prerelease. A single alphanumeric prerelease identifier, no dots. version.inc must already say the
# same version, minus the leading "v".
#
# Three modes. A tag push is always `release`; a run by hand picks one:
#   dry-run  build the installer and keep it as an artifact; publish nothing.
#   staging  the whole release flow, landing where nobody downloads it: the site's staging channel
#            (admins only on /admin/software, never /software or the update check) and a DRAFT
#            GitHub Release, which only maintainers see. Any branch or tag. Delete the draft after.
#   release  the real thing, from a tag.
#
# The same file goes into every repository that builds the slicer (see .github/publish/README.md).
# Releases are built and published only where the repository variable PUBLISH_RELEASES is true.
# Anywhere else a tag push builds nothing and a run by hand can't be `release`. Staging runs
# anywhere the UNLAYERED_SOFTWARE_STAGING_TOKEN secret is set.

# Manual only (Actions > Run workflow): automatic runs on push, pull request or a schedule
# cost money on the private repository, so none start on their own.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run: build only. staging: publish to staging + a draft GitHub Release. release: publish for real (run it on the tag).'
        type: choice
        options: [dry-run, staging, release]
        default: dry-run

permissions:
  contents: write # the GitHub Release
  actions: write # delete this run's artifacts once the installer is on the site

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  MODE: ${{ github.event_name == 'push' && 'release' || inputs.mode }}

jobs:
  windows:
    name: Release Windows
    # Tag pushes build only where the repository variable PUBLISH_RELEASES is true; by-hand runs
    # are checked by the guards below.
    if: vars.PUBLISH_RELEASES == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    # A cold dependency cache means building the whole vendored dep tree.
    timeout-minutes: 360

    steps:
      - name: Guard against running on a fork of this fork
        if: github.repository_owner != 'Unlayered3D' || github.repository == 'Unlayered3D/Unlayered-Slicer'
        run: |
          echo "::error::This workflow publishes releases from the private development repository only."
          exit 1

      - name: Guard against releasing from a repository that doesn't publish releases
        if: env.MODE == 'release' && vars.PUBLISH_RELEASES != 'true'
        run: |
          echo "::error::This repository doesn't publish releases (PUBLISH_RELEASES isn't true). Run this as dry-run or staging."
          exit 1

      - name: Guard against a release that isn't from a tag
        if: env.MODE == 'release' && github.ref_type != 'tag'
        run: |
          echo "::error::A release is published from its tag: pick the tag under Use workflow from, or push it. To try a branch, use staging."
          exit 1

      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: 'false'
          fetch-depth: 0

      - name: Read and validate the version
        id: version
        shell: pwsh
        run: |
          $content = Get-Content version.inc -Raw
          if ($content -notmatch 'set\(UNLAYERED_VERSION "(.*?)"\)') {
              Write-Output "::error::Could not read UNLAYERED_VERSION from version.inc"
              exit 1
          }
          $ver_pure = $matches[1]
          Write-Output "version.inc declares $ver_pure"

          # A dotted prerelease identifier (v0.0.4-beta.1) is silently ignored by the in-app update
          # check, which would publish a release no user is ever offered. Reject it here instead.
          $tagPattern = '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9]+)?$'

          if ("${{ github.ref_type }}" -eq 'tag') {
              $tag = "${{ github.ref_name }}"
              if ($tag -notmatch $tagPattern) {
                  Write-Output "::error::Tag '$tag' does not match $tagPattern. Use v0.0.4 or v0.0.4-beta1 - a single alphanumeric prerelease identifier, no dots."
                  exit 1
              }
              if ($tag -ne "v$ver_pure") {
                  Write-Output "::error::Tag '$tag' does not match version.inc ('$ver_pure'). Bump version.inc before tagging, or the shipped build will offer an update to itself."
                  exit 1
              }
              # GitHub marks it a prerelease when the tag carries a prerelease identifier.
              $prerelease = if ($tag -match '-') { 'true' } else { 'false' }
          } else {
              $tag = "v$ver_pure"
              $prerelease = 'true'
          }

          echo "ver_pure=$ver_pure"     | Out-File -Append -FilePath $env:GITHUB_OUTPUT -Encoding utf8
          echo "tag=$tag"               | Out-File -Append -FilePath $env:GITHUB_OUTPUT -Encoding utf8
          echo "prerelease=$prerelease" | Out-File -Append -FilePath $env:GITHUB_OUTPUT -Encoding utf8

      # Same key and path as build_check_cache.yml, so a warm cache from a Build all run is reused.
      # Do not "tidy" the orcaslicer_deps string: changing it invalidates every existing cache entry
      # and costs a multi-hour rebuild.
      - name: Restore cached deps
        id: cache_deps
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/deps/build/OrcaSlicer_dep
          key: windows-cache-orcaslicer_deps-build-${{ hashFiles('deps/**') }}

      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~4.3.0"
          useLocalCache: true
          useCloudCache: true

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build deps (cache miss only)
        if: steps.cache_deps.outputs.cache-hit != 'true'
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          choco install strawberryperl
          .\build_release_vs.bat deps

      - name: Save cached deps
        if: steps.cache_deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/deps/build/OrcaSlicer_dep
          key: windows-cache-orcaslicer_deps-build-${{ hashFiles('deps/**') }}

      - name: Install nsis
        run: choco install nsis

      # The bundled firmware is the updater's OFFLINE FALLBACK, and resources/firmware is
      # gitignored -- tools/make_firmware_bundle.py populates it from an RRF build tree, which a
      # slicer runner does not have and should not be made to build. Fetch the same release the
      # application itself would install instead: the manifest that bundler writes and the one
      # attached to a firmware release are deliberately the same format, so the assets drop in
      # verbatim.
      #
      # Resolution must match GitHubReleaseFirmwareSource (Utils/FirmwareBundle.cpp:399-410): it
      # lists releases and takes the FIRST non-draft entry rather than calling /releases/latest,
      # because the Unlayered firmware line is entirely pre-release and /latest skips all of it.
      # Resolving differently here would bundle a different build from the one the updater offers.
      - name: Bundle the printer firmware
        id: firmware
        working-directory: ${{ github.workspace }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = gh api 'repos/Unlayered3D/RepRapFirmware/releases?per_page=20' `
                   --jq 'map(select(.draft | not)) | .[0].tag_name // empty'
          if (-not $tag) {
            # No firmware release published yet. Ship without a fallback rather than holding the
            # slicer release hostage to another repo: that is exactly today's behaviour, and the
            # GitHub feed still serves the updater at runtime.
            Write-Warning 'No published firmware release found; resources/firmware will be empty.'
            "bundled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }
          Write-Host "Bundling printer firmware from $tag"
          New-Item -ItemType Directory -Force -Path resources/firmware | Out-Null
          # Named patterns, not every asset: a release may also carry .elf/.map debug artefacts,
          # and those would go into the installer for no reason.
          gh release download $tag --repo Unlayered3D/RepRapFirmware --dir resources/firmware `
             --clobber --pattern 'manifest.json' --pattern '*.uf2' --pattern '*.bin'
          Get-ChildItem resources/firmware | Format-Table Name, Length
          "bundled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      # Fails the release when the published firmware omits something the updater needs. This is
      # not hypothetical: the release cut for unlayered.2 carried the mainboard image alone, with
      # no IAP and no WiFi module, making it strictly less complete than the bundled copy it would
      # have overridden.
      - name: Verify the firmware bundle
        if: steps.firmware.outputs.bundled == 'true'
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: python tools/verify_firmware_updater.py --release

      - name: Build slicer
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: .\build_release_vs.bat slicer

      - name: Create installer
        working-directory: ${{ github.workspace }}/build
        run: cpack -G NSIS

      - name: Pack portable
        working-directory: ${{ github.workspace }}/build
        shell: cmd
        run: '"C:/Program Files/7-Zip/7z.exe" a -tzip Unlayered_Slicer_Windows_V${{ steps.version.outputs.ver_pure }}_portable.zip ${{ github.workspace }}/build/UnlayeredSlicer'

      - name: Pack PDB
        working-directory: ${{ github.workspace }}/build/src/Release
        shell: cmd
        run: '"C:/Program Files/7-Zip/7z.exe" a -m0=lzma2 -mx9 Unlayered_Slicer_PDB_V${{ steps.version.outputs.ver_pure }}_for_developers_only.7z *.pdb'

      # The installer goes to unlayered3d.com, which also builds /slicer/latest.json -- the in-app
      # update check -- from it; nothing here makes a manifest any more.
      - name: Collect assets
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.ver_pure }}"

          # The exact name CPack produces, from CPACK_PACKAGE_FILE_NAME. Asserted rather than
          # globbed: a glob that matches nothing turns a broken build into a silently empty release.
          # The release job builds x64 only; CMakeLists.txt appends the arch (_x64 / _arm64).
          $installer = "build/Unlayered_Slicer_Windows_Installer_V${ver}_x64.exe"
          if (-not (Test-Path $installer)) {
              Write-Output "::error::CPack did not produce $installer. If CPACK_PACKAGE_FILE_NAME changed in CMakeLists.txt, update this step and the Publish step below together."
              exit 1
          }

          New-Item -ItemType Directory -Force release-assets | Out-Null
          foreach ($f in @($installer, "build/Unlayered_Slicer_Windows_V${ver}_portable.zip")) {
              if (Test-Path $f) { Copy-Item $f release-assets/ } else { Write-Output "::warning::missing $f" }
          }
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLower()
          Write-Output "installer: $(Split-Path $installer -Leaf)  $((Get-Item $installer).Length) bytes  sha256=$hash"

      # Deleted once the release is on the site (below); a dry run keeps it for inspection.
      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: Unlayered_Slicer_Windows_V${{ steps.version.outputs.ver_pure }}
          path: release-assets/
          if-no-files-found: error

      # Debug symbols for crash reports. Not the software, so kept after a release, until the
      # repository's artifact retention runs out.
      - name: Upload debug symbols
        uses: actions/upload-artifact@v7
        with:
          name: Unlayered_Slicer_PDB_V${{ steps.version.outputs.ver_pure }}
          path: build/src/Release/Unlayered_Slicer_PDB_V${{ steps.version.outputs.ver_pure }}_for_developers_only.7z
          if-no-files-found: warn

      # A release is the site's stable build: /software's Windows download, and -- because the site
      # builds /slicer/latest.json from it -- the update every installed copy is offered. Staging
      # publishes the same way to the staging channel. The token decides the channel; the secret
      # holding it depends on the mode, and --expect-channel fails the run, before uploading, if that
      # secret holds the wrong one. See .github/publish/README.md.
      - name: Publish to unlayered3d.com
        if: env.MODE != 'dry-run'
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          UNLAYERED_SITE: ${{ vars.UNLAYERED_SITE || 'https://unlayered3d.com' }}
          UNLAYERED_SOFTWARE_PUBLISH_TOKEN: ${{ env.MODE == 'staging' && secrets.UNLAYERED_SOFTWARE_STAGING_TOKEN || secrets.UNLAYERED_SOFTWARE_PUBLISH_TOKEN }}
          SECRET_NAME: ${{ env.MODE == 'staging' && 'UNLAYERED_SOFTWARE_STAGING_TOKEN' || 'UNLAYERED_SOFTWARE_PUBLISH_TOKEN' }}
          CHANNEL: ${{ env.MODE == 'staging' && 'staging' || 'stable' }}
          VERSION: ${{ steps.version.outputs.ver_pure }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          if [ -z "$UNLAYERED_SOFTWARE_PUBLISH_TOKEN" ]; then
            echo "::error::The $SECRET_NAME secret is not set, so this can't go to unlayered3d.com (and no GitHub Release is made). See .github/publish/README.md."
            exit 1
          fi
          npm install --prefix .github/publish --no-audit --no-fund --no-package-lock
          args=(--expect-channel "$CHANNEL" --platform windows --arch x64 --version "$VERSION" --commit "$GITHUB_SHA"
                --build-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          [ -f release-notes.md ] && args+=(--notes-file release-notes.md)
          [ "$PRERELEASE" = true ] && args+=(--prerelease)
          node .github/publish/publish-software.mjs publish "${args[@]}" "build/Unlayered_Slicer_Windows_Installer_V$VERSION.exe"
          node .github/publish/publish-software.mjs list --expect-channel "$CHANNEL"

      # Downloads come from unlayered3d.com only, so the GitHub Release carries the tag and the
      # changelog but no files -- just a link to the site. It's created after the site publish, so
      # it never points at a download that isn't there. Staging makes a draft under its own tag name,
      # so it can never be mistaken for, or collide with, the real release; publishing a draft by
      # mistake would create that staging-* tag, nothing more.
      - name: Publish the GitHub Release
        if: env.MODE != 'dry-run'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.MODE == 'staging' && format('staging-{0}-run{1}', steps.version.outputs.tag, github.run_number) || steps.version.outputs.tag }}
          name: ${{ env.MODE == 'staging' && format('STAGING {0} (run {1})', steps.version.outputs.tag, github.run_number) || steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: ${{ env.MODE == 'staging' }}
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          body: |
            ${{ env.MODE == 'staging' && format('**Staging run, not a release.** Delete this draft once you have checked it. The build is in staging on unlayered3d.com/admin/software. [CI run]({0}/{1}/actions/runs/{2})', github.server_url, github.repository, github.run_id) || '**Download Unlayered Slicer from [unlayered3d.com/software](https://unlayered3d.com/software).** Installed copies are offered this update automatically.' }}

      # The installer is on the site now; the run's copies would be a second, public download.
      # A dry run keeps them, since that's how a dry run's build is inspected. The debug symbols stay.
      # Staging deletes them too, as a release would.
      - name: Delete the run's artifacts
        if: env.MODE != 'dry-run'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            -q '.artifacts[] | "\(.id) \(.name)"' \
            | { grep -v ' Unlayered_Slicer_PDB_' || true; } \
            | while read -r id name; do
                echo "Deleting $name"
                gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
              done
